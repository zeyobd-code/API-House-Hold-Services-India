version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: rajseba-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_SSL=${DATABASE_SSL:-true}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - rajseba-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {r.statusCode === 200 ? process.exit(0) : process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  uploads_data:
    name: rajseba_backend_uploads

networks:
  rajseba-network:
    driver: bridge
